<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vonera</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
@font-face{font-family:'Saira';src:url('assets/Saira-Var.ttf') format('truetype');font-weight:100 900;font-style:normal;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#FFFFFF;color:#0C1424;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:32px;text-align:center;
}
.brand{
  font-family:'Saira',sans-serif;font-weight:700;
  font-size:clamp(22px,3.4vw,30px);letter-spacing:.16em;
  margin-bottom:22px;
}
h1{
  font-family:'Saira',sans-serif;font-weight:650;
  font-size:clamp(24px,4.4vw,40px);letter-spacing:-.02em;line-height:1.2;
}
a{
  display:inline-block;margin-top:26px;
  font-size:14.5px;color:#55617A;text-decoration:none;
  border-bottom:1px solid #E3E8F0;padding-bottom:2px;
}
a:hover{color:#1D4ED8;border-color:#1D4ED8}
</style>
</head>
<body>
  <main>
    <div class="brand">VONERA</div>
    <h1>Website in progress</h1>
    <a href="mailto:contact@vonera.in">contact@vonera.in</a>
  </main>
</body>
</html>
